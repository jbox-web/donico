name: donico

version: 3.3.0

crystal: ">= 1.20.0"

license: MIT

authors:
  - Nicolas Rodriguez <nico@nicoladmin.fr>

description: |
  Builds, tests, pushes and cleans Docker images from a single donico.yml,
  locally and in GitLab CI.

repository: https://github.com/jbox-web/donico

targets:
  donico:
    main: src/donico.cr

dependencies:
  crest:
    github: mamantoha/crest
    version: ~> 1.9.0
  termisu:
    github: omarluq/termisu
    version: ~> 0.7.0

# crest: the HTTPS client of the fleet commands (`donico-manager repos update`
# asks the GitHub API for upstream versions), chosen by the owner over the
# stdlib client. It brings http_proxy, http-client-digest_auth and cookie_jar
# (http-cookie_jar upstream), and the binary now links OpenSSL.
# termisu: the text interface of `donico-manager repos update` (raw mode, the
# alternate screen, keys, cell drawing), MIT, no dependency of its own; its
# `Termisu::Testing` drives the binary on a pseudo-terminal in the specs.
# ameba is a mise tool (see mise.toml), not a development_dependency.
